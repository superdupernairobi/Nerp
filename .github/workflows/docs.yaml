name: Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: pages
        uses: actions/configure-pages@v5
      - run: npx moonwave@latest build --out-dir .moonwave-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .moonwave-build
      - id: deployment
        uses: actions/deploy-pages@v4
