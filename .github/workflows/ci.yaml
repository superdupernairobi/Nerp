name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check src

  types:
    name: Luau LSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rokit
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: rokit install --no-trust-check

      - name: Download Roblox definitions
        run: curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Build sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Analyze
        run: luau-lsp analyze --platform=roblox --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src
